name: integration-build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    container: ros:humble
    strategy:
      fail-fast: false
      matrix:
        repos: [demo.repos, demo.release.repos]
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          apt-get update
          apt-get install -y python3-vcstool ros-humble-turtlesim
      - name: Auth for private repos (SSH url -> HTTPS + token)
        env:
          TOKEN: ${{ secrets.DEMO_REPOS_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::secret DEMO_REPOS_TOKEN 이 없습니다 (README 'CI 설정' 참고)"; exit 1
          fi
          git config --global url."https://x-access-token:${TOKEN}@github.com/".insteadOf "git@github.com:"
      - name: Import & build
        shell: bash
        run: ./build.sh ${{ matrix.repos }}

  image:
    runs-on: ubuntu-22.04
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image (demo.release.repos)
        uses: docker/build-push-action@v6
        with:
          context: .
          build-args: REPOS=demo.release.repos
          secrets: gh_token=${{ secrets.DEMO_REPOS_TOKEN }}
          tags: imova-demo:ci
          load: true
      - name: Smoke test (headless, 15 s)
        run: |
          docker run -d --name demo --net=host imova-demo:ci
          sleep 15
          docker logs demo 2>&1 | tee demo.log
          grep -q "waypoint reached" demo.log
